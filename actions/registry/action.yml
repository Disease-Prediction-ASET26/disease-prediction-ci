name: Publish or clean application images
description: Publish scanned images or clean preview versions only.
inputs:
  command:
    description: publish, stage, index, or cleanup
    required: true
outputs:
  digest:
    description: Immutable digest reference of the published image.
    value: ${{ steps.registry.outputs.digest }}
runs:
  using: composite
  steps:
    - id: registry
      shell: bash
      env:
        REGISTRY_COMMAND: ${{ inputs.command }}
        REGISTRY_SCRIPT: ${{ github.action_path }}/registry.py
      run: python3 "$REGISTRY_SCRIPT" "$REGISTRY_COMMAND"
