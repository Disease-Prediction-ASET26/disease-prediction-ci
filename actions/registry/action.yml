name: Publish or clean application images
description: Publish scanned images or clean preview versions only.
inputs:
  command:
    description: stage, index, or cleanup
    required: true
outputs:
  digest:
    description: Raw SHA-256 digest of the published multi-platform image.
    value: ${{ steps.registry.outputs.digest }}
  image-reference:
    description: Published SemVer tag pinned to its verified SHA-256 digest.
    value: ${{ steps.registry.outputs.image-reference }}
  tag:
    description: SemVer-compatible tag used for the published image.
    value: ${{ steps.registry.outputs.tag }}
runs:
  using: composite
  steps:
    - id: registry
      shell: bash
      env:
        REGISTRY_COMMAND: ${{ inputs.command }}
        REGISTRY_SCRIPT: ${{ github.action_path }}/registry.py
      run: python3 "$REGISTRY_SCRIPT" "$REGISTRY_COMMAND"
