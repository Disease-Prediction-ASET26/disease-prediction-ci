name: Dependency scan
on:
  workflow_call:
    inputs:
      ecosystem:
        required: true
        type: string
      build-artifact:
        required: false
        type: string
        default: ''
permissions:
  contents: read
  packages: read
jobs:
  owasp:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Validate scan inputs
      env:
        ECOSYSTEM: ${{ inputs.ecosystem }}
        BUILD_ARTIFACT: ${{ inputs.build-artifact }}
      run: |
        case "$ECOSYSTEM" in
          python) test -f requirements.txt ;;
          maven) test -n "$BUILD_ARTIFACT" ;;
          *) echo "::error::Supported ecosystems: python, maven"; exit 1 ;;
        esac
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ inputs.ecosystem == 'maven' }}
      with:
        name: ${{ inputs.build-artifact }}
        path: target
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        # spaCy 3.7.x (via thinc/blis) ships no cp313 wheels, so pip would try
        # to compile blis from source and fail. Pin to 3.12 to match the
        # lint/build jobs, which have prebuilt wheels for this stack.
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
      if: ${{ inputs.ecosystem == 'python' }}
    - name: Resolve all Python application dependencies
      id: resolve
      if: ${{ inputs.ecosystem == 'python' }}
      run: |
        python -m venv "$RUNNER_TEMP/application-venv"
        "$RUNNER_TEMP/application-venv/bin/python" -m pip install -r requirements.txt
        mkdir -p "$RUNNER_TEMP/dependency-input"
        "$RUNNER_TEMP/application-venv/bin/python" -m pip freeze > "$RUNNER_TEMP/dependency-input/requirements.txt"
        test -s "$RUNNER_TEMP/dependency-input/requirements.txt"
        # Forward a project-provided suppression file (documented false
        # positives) into the scan input the OWASP scanner reads.
        if [ -f owasp-suppression.xml ]; then
          cp owasp-suppression.xml "$RUNNER_TEMP/dependency-input/owasp-suppression.xml"
        fi
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/scanner@619dda506a188b21d5918a9e9e301713fb607b06 # tools-v1.0.0
      name: OWASP Dependency-Check
      with:
        command: scan
      env:
        SCAN_PATH: ${{ inputs.ecosystem == 'python' && format('{0}/dependency-input', runner.temp) || format('{0}/target',
          github.workspace) }}
        ECOSYSTEM: ${{ inputs.ecosystem }}
    - name: Python advisory audit
      if: ${{ !cancelled() && inputs.ecosystem == 'python' && steps.resolve.outcome == 'success' }}
      run: |
        python -m venv "$RUNNER_TEMP/audit-venv"
        "$RUNNER_TEMP/audit-venv/bin/python" -m pip install pip-audit==2.10.1
        mkdir -p reports
        "$RUNNER_TEMP/audit-venv/bin/pip-audit" --requirement "$RUNNER_TEMP/dependency-input/requirements.txt" --no-deps --disable-pip --format json --output reports/pip-audit.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: dependency-reports
        path: reports/
        retention-days: 3
        if-no-files-found: warn
