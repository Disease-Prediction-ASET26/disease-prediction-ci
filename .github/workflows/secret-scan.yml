name: Secret scan
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  secret-scan:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install checksum-pinned Gitleaks
      env:
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        GITLEAKS_VERSION: 8.30.1
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$url" --output "$archive"
        printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" version
    - name: Scan changed commits for secrets
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 "$GITHUB_WORKSPACE"
        else
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" "$GITHUB_WORKSPACE"
        fi
