name: Containerize and scan
on:
  workflow_call:
    inputs:
      build-artifact:
        required: false
        type: string
        default: ''
      dev-dockerfile:
        required: false
        type: string
        default: Dockerfile.dev
      production-dockerfile:
        required: false
        type: string
        default: Dockerfile.prod
      gitops-image-name:
        required: false
        type: string
        default: ''
        description: Deployment name in the Oracle GitOps manifests (backend or frontend).
    secrets:
      GITOPS_CLIENT_ID:
        required: false
      GITOPS_APP_PRIVATE_KEY:
        required: false
    outputs:
      image-digest:
        description: Immutable digest reference of the published image.
        value: ${{ jobs.publish.outputs.image-digest }}
permissions:
  contents: read
  packages: write
  pull-requests: read
concurrency:
  group: registry-${{ github.repository }}${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' && '-prod' || github.ref == 'refs/heads/develop' && '-dev' || '-other') || '' }}
  cancel-in-progress: false
  queue: max
jobs:
  containerize:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select image environment
      id: target
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        GITHUB_REF: ${{ github.ref }}
        DEV_DOCKERFILE: ${{ inputs.dev-dockerfile }}
        PRODUCTION_DOCKERFILE: ${{ inputs.production-dockerfile }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          branch="$BASE_REF"
        else
          branch="${GITHUB_REF#refs/heads/}"
        fi
        case "$branch" in
          develop)
            dockerfile="$DEV_DOCKERFILE"
            channel=dev
            ;;
          main)
            dockerfile="$PRODUCTION_DOCKERFILE"
            channel=production
            ;;
          *)
            echo "::error::Container builds are supported only for develop and main.";
            exit 1
            ;;
        esac
        test -f "$dockerfile"
        echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Building the $channel image from $dockerfile."
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ inputs.build-artifact != '' }}
      with:
        name: ${{ inputs.build-artifact }}
        path: target
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      name: containerize
      with:
        context: .
        file: ${{ steps.target.outputs.dockerfile }}
        load: true
        push: false
        platforms: linux/${{ matrix.arch }}
        provenance: false
        sbom: false
        tags: app-candidate:checked
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          ci.run=${{ github.run_id }}-${{ github.run_attempt }}
          ci.pr=${{ github.event.pull_request.number || 0 }}
          org.opencontainers.image.ref.name=${{ github.ref_name }}
        cache-from: type=gha,scope=application-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=application-${{ matrix.arch }}
    - name: Record image identity before scan
      id: identity
      run: |
        mkdir -p reports
        image_id="$(docker image inspect app-candidate:checked --format '{{.Id}}')"
        echo "id=$image_id" >> "$GITHUB_OUTPUT"
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      name: scan
      with:
        version: v0.70.0
        scan-type: image
        image-ref: app-candidate:checked
        scanners: vuln
        format: json
        output: reports/trivy.json
        severity: HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: '0'
        cache: true
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      name: Block images with fixable HIGH or CRITICAL findings
      with:
        version: v0.70.0
        scan-type: image
        image-ref: app-candidate:checked
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
        cache: true
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Check out the shared publisher
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # JSON lookup supports these newer job context fields in actionlint 1.7.12.
        repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
        ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
        path: shared-ci
        persist-credentials: false
    - uses: ./shared-ci/actions/registry
      name: Stage the scanned platform image
      with:
        command: stage
      env:
        GH_TOKEN: ${{ github.token }}
        SCANNED_IMAGE_ID: ${{ steps.identity.outputs.id }}
        IMAGE_ARCH: ${{ matrix.arch }}
        STAGE_OUTPUT: stage-${{ matrix.arch }}.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: image-stage-${{ matrix.arch }}
        path: stage-${{ matrix.arch }}.json
        retention-days: 3
        if-no-files-found: error
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: container-scan-report-${{ matrix.arch }}
        path: reports/
        retention-days: 3
        if-no-files-found: warn

  publish:
    name: Publish the scanned multi-platform index
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    needs: containerize
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image-digest: ${{ steps.publish.outputs.digest }}
    steps:
    - name: Check out the shared publisher
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
        ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
        path: shared-ci
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: image-stage-*
        path: image-stages
        merge-multiple: true
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: ./shared-ci/actions/registry
      name: Publish both scanned architectures
      id: publish
      with:
        command: index
      env:
        GH_TOKEN: ${{ github.token }}
        STAGE_DIR: image-stages

  update-gitops:
    name: open Oracle image update
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && inputs.gitops-image-name != '' && github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && needs.publish.outputs.image-digest != '' }}
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require GitOps app credentials
        env:
          APP_ID: ${{ secrets.GITOPS_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Set GITOPS_CLIENT_ID and GITOPS_APP_PRIVATE_KEY before publishing images."
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: gitops-token
        with:
          client-id: ${{ secrets.GITOPS_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: Disease-Prediction-ASET26
          repositories: disease-prediction-gitops
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Disease-Prediction-ASET26/disease-prediction-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Pin the new digest
        env:
          IMAGE_NAME: ${{ inputs.gitops-image-name }}
          IMAGE_REF: ${{ needs.publish.outputs.image-digest }}
          TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          deployments = {
              "backend": "disease-prediction-be",
              "frontend": "disease-prediction-fe",
          }
          deployment = os.environ["IMAGE_NAME"]
          package = deployments.get(deployment)
          if package is None:
              raise SystemExit("gitops-image-name must be backend or frontend")

          environment = os.environ["TARGET_ENV"]
          if environment not in {"dev", "prod"}:
              raise SystemExit("Unknown target environment")
          package += "-dev" if environment == "dev" else ""
          image_ref = os.environ["IMAGE_REF"]
          expected = rf"ghcr\.io/disease-prediction-aset26/{package}@sha256:[0-9a-f]{{64}}"
          if not re.fullmatch(expected, image_ref):
              raise SystemExit("Published digest does not match the expected package")

          directory = "disease-prediction" if environment == "dev" else "disease-prediction-prod"
          path = Path("gitops/clusters/oracle") / directory / "deployments.yaml"
          text = path.read_text(encoding="utf-8")
          sections = text.split("\n---\n")
          matches = 0
          for index, section in enumerate(sections):
              if not re.search(r"(?m)^kind: Deployment$", section):
                  continue
              if not re.search(rf"(?m)^  name: {re.escape(deployment)}$", section):
                  continue
              pattern = r"(?m)^([ \t]*image:[ \t]*)[^\r\n]+"
              if len(re.findall(pattern, section)) != 1:
                  raise SystemExit(f"Expected one image in the {deployment} Deployment")
              sections[index] = re.sub(pattern, lambda match: match[1] + image_ref, section, count=1)
              matches += 1

          if matches != 1:
              raise SystemExit(f"Expected one {deployment} Deployment, found {matches}")
          path.write_text("\n---\n".join(sections), encoding="utf-8")
          PY
          git -C gitops diff --check

      - name: Open or update the GitOps pull request
        id: gitops-pr
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          IMAGE_NAME: ${{ inputs.gitops-image-name }}
          IMAGE_REF: ${{ needs.publish.outputs.image-digest }}
          TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
        run: |
          gh auth setup-git
          branch="automation/update-${IMAGE_NAME}-${TARGET_ENV}"
          if [[ "$TARGET_ENV" == "dev" ]]; then
            manifest="clusters/oracle/disease-prediction/deployments.yaml"
          else
            manifest="clusters/oracle/disease-prediction-prod/deployments.yaml"
          fi
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "github-actions[bot]@users.noreply.github.com"
          git -C gitops switch -c "$branch"
          git -C gitops add "$manifest"
          if git -C gitops diff --cached --quiet; then
            echo "The Oracle $TARGET_ENV manifest already uses this digest."
            exit 0
          fi
          git -C gitops commit -m "Update ${IMAGE_NAME} ${TARGET_ENV} image digest"
          git -C gitops push --force origin "HEAD:refs/heads/$branch"

          title="Update ${IMAGE_NAME} ${TARGET_ENV} image digest"
          body="CI published the immutable ${TARGET_ENV} image ${IMAGE_REF}. Review and merge this pull request to let Argo CD sync the Oracle ${TARGET_ENV} stack."
          number="$(gh pr list --repo Disease-Prediction-ASET26/disease-prediction-gitops --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo Disease-Prediction-ASET26/disease-prediction-gitops --title "$title" --body "$body"
          else
            gh pr create --repo Disease-Prediction-ASET26/disease-prediction-gitops --base main --head "$branch" --title "$title" --body "$body"
            number="$(gh pr list --repo Disease-Prediction-ASET26/disease-prediction-gitops --head "$branch" --state open --json number --jq '.[0].number // empty')"
          fi
          [[ "$number" =~ ^[0-9]+$ ]]
          head_sha="$(git -C gitops rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'number=%s\nhead-sha=%s\n' "$number" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the shared merger
        if: ${{ steps.gitops-pr.outputs.number != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: shared-ci
          persist-credentials: false

      - name: Merge the checked GitOps update
        if: ${{ steps.gitops-pr.outputs.number != '' }}
        uses: ./shared-ci/actions/merge-gitops
        with:
          token: ${{ steps.gitops-token.outputs.token }}
          number: ${{ steps.gitops-pr.outputs.number }}
          head-sha: ${{ steps.gitops-pr.outputs.head-sha }}
          manifest: ${{ github.ref == 'refs/heads/main' && 'clusters/oracle/disease-prediction-prod/deployments.yaml' || 'clusters/oracle/disease-prediction/deployments.yaml' }}
          deployment: ${{ inputs.gitops-image-name }}
          image: ${{ needs.publish.outputs.image-digest }}
          source-repository: ${{ github.repository }}
          source-branch: ${{ github.ref_name }}
          source-sha: ${{ github.sha }}
