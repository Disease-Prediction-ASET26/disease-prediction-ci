name: Containerize and scan
on:
  workflow_call:
    inputs:
      build-artifact:
        required: false
        type: string
        default: ''
      dev-dockerfile:
        required: false
        type: string
        default: Dockerfile.dev
      production-dockerfile:
        required: false
        type: string
        default: Dockerfile.prod
      gitops-image-name:
        required: false
        type: string
        default: ''
        description: Deployment name in the Oracle dev GitOps manifest (backend or frontend).
    secrets:
      GITOPS_APP_ID:
        required: false
      GITOPS_APP_PRIVATE_KEY:
        required: false
    outputs:
      image-digest:
        description: Immutable digest reference of the published image.
        value: ${{ jobs.containerize.outputs.image-digest }}
permissions:
  contents: read
  packages: write
  pull-requests: read
jobs:
  containerize:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    outputs:
      image-digest: ${{ steps.publish.outputs.digest }}
      channel: ${{ steps.target.outputs.channel }}
    concurrency:
      group: registry-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select image environment
      id: target
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        GITHUB_REF: ${{ github.ref }}
        DEV_DOCKERFILE: ${{ inputs.dev-dockerfile }}
        PRODUCTION_DOCKERFILE: ${{ inputs.production-dockerfile }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          branch="$BASE_REF"
        else
          branch="${GITHUB_REF#refs/heads/}"
        fi
        case "$branch" in
          develop)
            dockerfile="$DEV_DOCKERFILE"
            channel=dev
            ;;
          main)
            dockerfile="$PRODUCTION_DOCKERFILE"
            channel=production
            ;;
          *)
            echo "::error::Container builds are supported only for develop and main.";
            exit 1
            ;;
        esac
        test -f "$dockerfile"
        echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Building the $channel image from $dockerfile."
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: ${{ inputs.build-artifact != '' }}
      with:
        name: ${{ inputs.build-artifact }}
        path: target
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      name: containerize
      with:
        context: .
        file: ${{ steps.target.outputs.dockerfile }}
        load: true
        push: false
        platforms: linux/arm64
        provenance: false
        sbom: false
        tags: app-candidate:checked
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          ci.run=${{ github.run_id }}-${{ github.run_attempt }}
          ci.pr=${{ github.event.pull_request.number || 0 }}
          org.opencontainers.image.ref.name=${{ github.ref_name }}
        cache-from: type=gha,scope=application
        cache-to: type=gha,mode=max,scope=application
    - name: Record image identity before scan
      id: identity
      run: |
        mkdir -p reports
        image_id="$(docker image inspect app-candidate:checked --format '{{.Id}}')"
        echo "id=$image_id" >> "$GITHUB_OUTPUT"
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      name: scan
      with:
        version: v0.70.0
        scan-type: image
        image-ref: app-candidate:checked
        scanners: vuln
        format: json
        output: reports/trivy.json
        severity: HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: '0'
        cache: true
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      name: Block images with fixable HIGH or CRITICAL findings
      with:
        version: v0.70.0
        scan-type: image
        image-ref: app-candidate:checked
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
        cache: true
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/registry@9c72eae15aa86cf769d23c0da7faacdbd150c286 # registry publisher with transient GHCR push retries
      name: Publish the scanned image and retain current preview
      id: publish
      with:
        command: publish
      env:
        GH_TOKEN: ${{ github.token }}
        SCANNED_IMAGE_ID: ${{ steps.identity.outputs.id }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: container-scan-report
        path: reports/
        retention-days: 3
        if-no-files-found: warn

  update-gitops:
    name: open Oracle dev image update
    if: ${{ inputs.gitops-image-name != '' && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.containerize.outputs.image-digest != '' }}
    needs:
      - containerize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require GitOps app credentials
        env:
          APP_ID: ${{ secrets.GITOPS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Set GITOPS_APP_ID and GITOPS_APP_PRIVATE_KEY before publishing dev images."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gitops-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: Disease-Prediction-ASET26
          repositories: disease-prediction-gitops
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Disease-Prediction-ASET26/disease-prediction-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      - name: Pin the new dev digest
        env:
          IMAGE_NAME: ${{ inputs.gitops-image-name }}
          IMAGE_REF: ${{ needs.containerize.outputs.image-digest }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          deployments = {
              "backend": "disease-prediction-be-dev",
              "frontend": "disease-prediction-fe-dev",
          }
          deployment = os.environ["IMAGE_NAME"]
          package = deployments.get(deployment)
          if package is None:
              raise SystemExit("gitops-image-name must be backend or frontend")

          image_ref = os.environ["IMAGE_REF"]
          expected = rf"ghcr\.io/disease-prediction-aset26/{package}@sha256:[0-9a-f]{{64}}"
          if not re.fullmatch(expected, image_ref):
              raise SystemExit("Published digest does not match the expected dev package")

          path = Path("gitops/clusters/oracle/disease-prediction/deployments.yaml")
          text = path.read_text(encoding="utf-8")
          sections = text.split("\n---\n")
          matches = 0
          for index, section in enumerate(sections):
              if not re.search(r"(?m)^kind: Deployment$", section):
                  continue
              if not re.search(rf"(?m)^  name: {re.escape(deployment)}$", section):
                  continue
              lines = section.splitlines()
              image_lines = [i for i, line in enumerate(lines) if re.match(r"^\s+image:\s", line)]
              if len(image_lines) != 1:
                  raise SystemExit(f"Expected one image in the {deployment} Deployment")
              line_index = image_lines[0]
              indent = re.match(r"^(\s+image:\s*)", lines[line_index]).group(1)
              lines[line_index] = indent + image_ref
              sections[index] = "\n".join(lines)
              matches += 1

          if matches != 1:
              raise SystemExit(f"Expected one {deployment} Deployment, found {matches}")
          path.write_text("\n---\n".join(sections), encoding="utf-8")
          PY
          git -C gitops diff --check

      - name: Open or update the GitOps pull request
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          IMAGE_NAME: ${{ inputs.gitops-image-name }}
          IMAGE_REF: ${{ needs.containerize.outputs.image-digest }}
        run: |
          branch="automation/update-${IMAGE_NAME}-dev"
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "github-actions[bot]@users.noreply.github.com"
          git -C gitops switch -c "$branch"
          git -C gitops add clusters/oracle/disease-prediction/deployments.yaml
          if git -C gitops diff --cached --quiet; then
            echo "The Oracle dev manifest already uses this digest."
            exit 0
          fi
          git -C gitops commit -m "Update ${IMAGE_NAME} dev image digest"
          git -C gitops push --force origin "HEAD:refs/heads/$branch"

          title="Update ${IMAGE_NAME} dev image digest"
          body="CI published the immutable dev image ${IMAGE_REF}. Review and merge this pull request to let Argo CD sync the Oracle dev stack."
          number="$(gh pr list --repo Disease-Prediction-ASET26/disease-prediction-gitops --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo Disease-Prediction-ASET26/disease-prediction-gitops --title "$title" --body "$body"
          else
            gh pr create --repo Disease-Prediction-ASET26/disease-prediction-gitops --base main --head "$branch" --title "$title" --body "$body"
          fi
