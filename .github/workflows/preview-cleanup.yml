name: Clean previews
on:
  workflow_call: {}
permissions:
  contents: read
  packages: write
  pull-requests: read
jobs:
  cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: registry-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # JSON lookup supports these newer job context fields in actionlint 1.7.12.
        repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
        ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
        path: shared-ci
        persist-credentials: false
    - uses: ./shared-ci/actions/registry
      with:
        command: cleanup
      env:
        GH_TOKEN: ${{ github.token }}
