name: Clean previews
on:
  workflow_call: {}
permissions:
  contents: read
  packages: write
  pull-requests: read
jobs:
  cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: registry-${{ github.repository }}
      cancel-in-progress: false
    steps:
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/registry@619dda506a188b21d5918a9e9e301713fb607b06 # tools-v1.0.0
      with:
        command: cleanup
      env:
        GH_TOKEN: ${{ github.token }}
