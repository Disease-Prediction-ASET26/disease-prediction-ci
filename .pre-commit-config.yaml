# Install pre-commit once with: pipx install pre-commit
# Install the hook in this checkout with: pre-commit install
# Run all hooks with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(actions|tests)/.*\.py$
      - id: ruff-format
        files: ^(actions|tests)/.*\.py$
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.36
    hooks:
      - id: pymarkdown
        args: [fix]
